server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # Los archivos con hash del bundle no cambian nunca: se pueden cachear sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de la SPA (/dashboard, /chat, ...) se resuelven en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
