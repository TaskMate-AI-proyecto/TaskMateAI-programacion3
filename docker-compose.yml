# Sistema completo de TaskMate AI en un solo comando:
#   docker compose up -d --build --wait
# Requiere un archivo .env en la raíz (ver .env.example): JWT_SECRET y GEMINI_API_KEY son obligatorios.

services:
  db:
    image: postgres:16-alpine
    container_name: taskmate_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taskmate_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskmate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Crea la base del backend Python si todavía no existe. Es idempotente: sirve también para volúmenes ya creados.
  db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command:
      - sh
      - -c
      - |
        psql -h db -U ${POSTGRES_USER:-postgres} -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='taskmate_python'" | grep -q 1 \
          || psql -h db -U ${POSTGRES_USER:-postgres} -d postgres -c 'CREATE DATABASE taskmate_python'
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Aplica las migraciones de Prisma antes de arrancar el backend Node. Termina con código 0.
  migrate:
    build:
      context: ./apps/backend-node
      target: build
    command: npm run prisma:migrate:deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-taskmate_db}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./apps/backend-node
      target: production
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-taskmate_db}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Define GEMINI_API_KEY en .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173,http://localhost:5174}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-TaskMate AI <no-reply@taskmate.ai>}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backend-python:
    build:
      context: ./apps/backend-python
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/taskmate_python
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Define GEMINI_API_KEY en .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173,http://localhost:5174}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend-react:
    build:
      context: ./apps/frontend-react
      args:
        VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend-vue:
    build:
      context: ./apps/frontend-vue
      args:
        VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "5174:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
